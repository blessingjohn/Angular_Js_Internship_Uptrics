<div class="container" ng-controller="TaskController">

    <h2 class="mb-4">Task List</h2>

    <div class="row mb-3">

        <div class="col-md-6">

            <input type="text" class="form-control" placeholder="Search Task..." ng-model="searchTask">

        </div>

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Task</th>
                <th>Assigned To</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

            <tr ng-repeat="task in tasks | filter:searchTask">

                <td>{{task.id}}</td>

                <td>{{task.title}}</td>

                <td>{{task.assignedTo}}</td>

                <td>{{task.priority}}</td>

                <td>{{task.status}}</td>

                <td>

                    <button class="btn btn-warning btn-sm" ng-click="editTask(task)">
                        Edit
                    </button>

                    <button class="btn btn-danger btn-sm" ng-click="deleteTask(task.id)">
                        Delete
                    </button>

                </td>

            </tr>

        </tbody>

    </table>

</div>
