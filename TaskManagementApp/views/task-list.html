<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            <i class="bi bi-list-task"></i>
            Task List
        </h2>

        <a href="#!/create" class="btn btn-primary">

            <i class="bi bi-plus-circle"></i>

            Create Task

        </a>

    </div>

    <!-- Search / Filter / Sort -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <div class="row">

                <!-- Search -->

                <div class="col-lg-4 col-md-6 mb-3">

                    <label class="form-label fw-bold">

                        Search

                    </label>

                    <input type="text" class="form-control" placeholder="🔍 Search task or assigned person..."
                        ng-model="searchTask">

                </div>

                <!-- Status Filter -->

                <div class="col-lg-3 col-md-6 mb-3">

                    <label class="form-label fw-bold">

                        Status

                    </label>

                    <select class="form-select" ng-model="statusFilter">

                        <option value="">All Status</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>

                    </select>

                </div>

                <!-- Priority Filter -->

                <div class="col-lg-3 col-md-6 mb-3">

                    <label class="form-label fw-bold">

                        Priority

                    </label>

                    <select class="form-select" ng-model="priorityFilter">

                        <option value="">All Priority</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>

                    </select>

                </div>

                <!-- Sort -->

                <div class="col-lg-2 col-md-6 mb-3">

                    <label class="form-label fw-bold">

                        Sort By

                    </label>

                    <select class="form-select" ng-model="sortField">

                        <option value="dueDate">Due Date</option>
                        <option value="title">Task Name</option>
                        <option value="assignedTo">Assigned To</option>
                        <option value="priority">Priority</option>
                        <option value="status">Status</option>

                    </select>

                </div>

            </div>

        </div>

    </div>

    <!-- Task Table -->

    <div class="card shadow">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-dark">

                        <tr>

                            <th>S.No.</th>
                            <th>Task</th>
                            <th>Assigned To</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Due Date</th>
                            <th width="170">Actions</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr ng-repeat="task in tasks
                                       | filter:searchTask
                                       | filter:filterTasks
                                       | orderBy:sortField
                                       track by task.id">

                            <td>{{$index + 1}}</td>

                            <td>

                                <strong>{{task.title}}</strong>

                            </td>

                            <td>{{task.assignedTo}}</td>

                            <td>

                                <span class="badge bg-danger" ng-if="task.priority=='High'">

                                    🔴 High

                                </span>

                                <span class="badge bg-warning text-dark" ng-if="task.priority=='Medium'">

                                    🟡 Medium

                                </span>

                                <span class="badge bg-success" ng-if="task.priority=='Low'">

                                    🟢 Low

                                </span>

                            </td>

                            <td>

                                <span class="badge bg-warning text-dark" ng-if="task.status=='Pending'">

                                    Pending

                                </span>

                                <span class="badge bg-primary" ng-if="task.status=='In Progress'">

                                    In Progress

                                </span>

                                <span class="badge bg-success" ng-if="task.status=='Completed'">

                                    Completed

                                </span>

                            </td>

                            <td>

                                {{task.dueDate | date:'dd MMM yyyy'}}

                            </td>

                            <td>

                                <button class="btn btn-warning btn-sm me-2" ng-click="editTask(task)">

                                    <i class="bi bi-pencil-square"></i>

                                </button>

                                <button class="btn btn-danger btn-sm" ng-click="deleteTask(task.id)">

                                    <i class="bi bi-trash"></i>

                                </button>

                            </td>

                        </tr>

                        <!-- Empty State -->

                        <tr ng-if="(tasks | filter:searchTask | filter:filterTasks).length==0">

                            <td colspan="7" class="text-center py-5">

                                <h4>

                                    📋 No Tasks Found

                                </h4>

                                <p class="text-muted">

                                    Try changing your search or filters.

                                </p>

                                <a href="#!/create" class="btn btn-primary">

                                    Create New Task

                                </a>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
