<div class="container">

    <!-- Page Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">

                <i class="bi bi-plus-circle-fill text-primary"></i>

                {{ editId ? 'Update Task' : 'Create New Task' }}

            </h2>

            <p class="text-muted mb-0">

                Create and assign tasks to your team members.

            </p>

        </div>

        <a href="#!/tasks" class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left"></i>

            Back to Tasks

        </a>

    </div>

    <!-- Form Card -->

    <div class="card shadow-lg border-0">

        <div class="card-header bg-primary text-white">

            <h5 class="mb-0">

                <i class="bi bi-pencil-square"></i>

                Task Information

            </h5>

        </div>

        <div class="card-body">

            <div class="row">

                <!-- Task Title -->

                <div class="col-md-6 mb-4">

                    <label class="form-label fw-semibold">

                        <i class="bi bi-card-text"></i>

                        Task Title

                        <span class="text-danger">*</span>

                    </label>

                    <input type="text" class="form-control" placeholder="Enter task title" ng-model="newTask.title">

                </div>

                <!-- Assigned To -->

                <div class="col-md-6 mb-4">

                    <label class="form-label fw-semibold">

                        <i class="bi bi-person-fill"></i>

                        Assigned To

                        <span class="text-danger">*</span>

                    </label>

                    <input type="text" class="form-control" placeholder="Enter employee name"
                        ng-model="newTask.assignedTo">

                </div>

                <!-- Priority -->

                <div class="col-md-4 mb-4">

                    <label class="form-label fw-semibold">

                        <i class="bi bi-flag-fill"></i>

                        Priority

                    </label>

                    <select class="form-select" ng-model="newTask.priority">

                        <option value="High">🔴 High</option>

                        <option value="Medium">🟡 Medium</option>

                        <option value="Low">🟢 Low</option>

                    </select>

                </div>

                <!-- Status -->

                <div class="col-md-4 mb-4">

                    <label class="form-label fw-semibold">

                        <i class="bi bi-check2-circle"></i>

                        Status

                    </label>

                    <select class="form-select" ng-model="newTask.status">

                        <option value="Pending">

                            Pending

                        </option>

                        <option value="In Progress">

                            In Progress

                        </option>

                        <option value="Completed">

                            Completed

                        </option>

                    </select>

                </div>

                <!-- Due Date -->

                <div class="col-md-4 mb-4">

                    <label class="form-label fw-semibold">

                        <i class="bi bi-calendar-event"></i>

                        Due Date

                        <span class="text-danger">*</span>

                    </label>

                    <input type="date" class="form-control" ng-model="newTask.dueDate">

                </div>

            </div>

        </div>

        <!-- Footer -->

        <div class="card-footer bg-light">

            <div class="d-flex justify-content-end">

                <a href="#!/tasks" class="btn btn-secondary me-2">

                    <i class="bi bi-x-circle"></i>

                    Cancel

                </a>

                <button class="btn btn-primary" ng-click="addTask()">

                    <i class="bi" ng-class="editId ? 'bi-pencil-square' : 'bi-plus-circle'"></i>

                    {{ editId ? 'Update Task' : 'Create Task' }}

                </button>

            </div>

        </div>

    </div>

</div>
