<div class="container" ng-controller="DashboardController">

    <h2 class="mb-4">Dashboard</h2>

    <div class="row">

        <div class="col-md-3">
            <div class="card text-white bg-primary mb-3">
                <div class="card-body">
                    <h5>Total Tasks</h5>
                    <h2>{{totalTasks}}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-warning mb-3">
                <div class="card-body">
                    <h5>Pending</h5>
                    <h2>{{pendingTasks}}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-info mb-3">
                <div class="card-body">
                    <h5>In Progress</h5>
                    <h2>{{progressTasks}}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5>Completed</h5>
                    <h2>{{completedTasks}}</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="card mt-3">
        <div class="card-header">
            Recent Tasks
        </div>

        <div class="card-body">
            <p>No tasks created yet.</p>
        </div>
    </div>

</div>
